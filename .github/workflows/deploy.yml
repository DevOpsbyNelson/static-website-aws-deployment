name: Deploy

on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - "infrastructure/**"
      - ".github/workflows/deploy.yml"
      - ".github/workflows/tests.yml"
  workflow_dispatch:
    inputs:
      action:
        description: Terraform action to run
        type: choice
        options: [apply, plan]
        default: apply

permissions: {}

jobs:
  test:
    permissions:
      contents: read
    uses: ./.github/workflows/tests.yml

  deploy:
    needs: test
    permissions:
      contents: read
      id-token: write # allows the AWS OIDC step below to request a short-lived token
    strategy:
      fail-fast: false
      matrix:
        environment: [development, staging, production]
    runs-on: ubuntu-latest
    # GitHub environment per stage: holds its secrets and protection rules (e.g. required reviewers for production).
    environment: ${{ matrix.environment }}
    concurrency:
      group: deploy-${{ matrix.environment }}
      cancel-in-progress: false
    env:
      ENVIRONMENT: ${{ matrix.environment }}
      ACTION: ${{ inputs.action || 'apply' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # --- Build the website (Terraform uploads website/dist) -----------------------------
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: "11.16.0"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
          cache: pnpm
          cache-dependency-path: website/pnpm-lock.yaml

      - name: Build website
        working-directory: website
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.15.6"
          terraform_wrapper: false # the scripts read terraform's stdout directly

      # --- AWS credentials (OIDC) -------------------------------------------------------------
      # Assumes the deploy role from aws_role/ with short-lived credentials; no AWS keys are stored.
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      # --- Deploy -----------------------------------------------------------------------------
      # Secrets go to the runner's temp dir (outside the checkout) and are removed afterwards.
      - name: Write environment secrets
        run: |
          if [ -z "$REMOTE_STATE_ENV" ]; then
            echo "::error::Set the REMOTE_STATE_ENV secret for the '$ENVIRONMENT' environment."
            exit 1
          fi
          umask 077
          ENV_FILE="$RUNNER_TEMP/remote-state.$ENVIRONMENT.env"
          printf '%s\n' "$REMOTE_STATE_ENV" > "$ENV_FILE"
          echo "ENV_FILE=$ENV_FILE" >> "$GITHUB_ENV"
          if [ -n "$TFVARS_JSON" ]; then
            TFVARS_FILE="$RUNNER_TEMP/$ENVIRONMENT.tfvars.json"
            printf '%s' "$TFVARS_JSON" | jq -e . > "$TFVARS_FILE"
            echo "TFVARS_FILE=$TFVARS_FILE" >> "$GITHUB_ENV"
          fi
        env:
          REMOTE_STATE_ENV: ${{ secrets.REMOTE_STATE_ENV }}
          TFVARS_JSON: ${{ secrets.TFVARS_JSON }}

      - name: Deploy
        run: bash infrastructure/scripts/deploy.sh

      - name: Show website URL
        if: env.ACTION == 'apply'
        working-directory: infrastructure
        run: echo "### $ENVIRONMENT → $(terraform output -raw website_url)" >> "$GITHUB_STEP_SUMMARY"

      - name: Remove secrets written to disk
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/remote-state.$ENVIRONMENT.env" "$RUNNER_TEMP/$ENVIRONMENT.tfvars.json"
          rm -rf infrastructure/.terraform # holds backend config, possibly with credentials
