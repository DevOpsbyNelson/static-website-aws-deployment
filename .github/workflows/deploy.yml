name: Deploy

# Each branch deploys its own stage: main -> production, staging -> staging, dev -> development.
on:
  push:
    branches: [main, staging, dev]
    paths:
      - "website/**"
      - "infrastructure/**"
      - ".github/workflows/deploy.yml"
      - ".github/workflows/tests.yml"
  workflow_dispatch:
    inputs:
      action:
        description: Terraform action to run
        type: choice
        options: [apply, plan]
        default: apply
      commit_sha:
        description: Roll the website back to this commit (full or short SHA from the selected branch's history; empty = latest)
        type: string
        default: ""

permissions: {}

jobs:
  # Maps the branch to its stage; other branches (e.g. a manual run from a feature branch) deploy nothing.
  stage:
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      environment: ${{ steps.map.outputs.environment }}
    steps:
      - id: map
        run: |
          case "$BRANCH" in
            main) ENVIRONMENT=production ;;
            staging) ENVIRONMENT=staging ;;
            dev) ENVIRONMENT=development ;;
            *) ENVIRONMENT="" ;;
          esac
          echo "environment=$ENVIRONMENT" >> "$GITHUB_OUTPUT"
          if [ -n "$ENVIRONMENT" ]; then
            echo "Branch $BRANCH deploys to $ENVIRONMENT"
          else
            echo "::notice::Branch $BRANCH is not mapped to a stage (main, staging, dev); nothing to deploy."
          fi
        env:
          BRANCH: ${{ github.ref_name }}

  test:
    permissions:
      contents: read
    uses: ./.github/workflows/tests.yml

  deploy:
    needs: [stage, test]
    if: needs.stage.outputs.environment != ''
    permissions:
      contents: read
      id-token: write # allows the AWS OIDC step below to request a short-lived token
    runs-on: ubuntu-latest
    # GitHub environment per stage: holds its secrets and protection rules (e.g. required reviewers for production).
    environment: ${{ needs.stage.outputs.environment }}
    concurrency:
      group: deploy-${{ needs.stage.outputs.environment }}
      cancel-in-progress: false
    env:
      ENVIRONMENT: ${{ needs.stage.outputs.environment }}
      ACTION: ${{ inputs.action || 'apply' }}
      COMMIT_SHA: ${{ inputs.commit_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: ${{ inputs.commit_sha != '' && '0' || '1' }} # rollbacks need the branch history

      # --- Rollback (manual runs with commit_sha) ---------------------------------------------
      # Only website/ goes back to that commit; Terraform and the scripts stay at the branch's
      # latest version, so a rollback never re-applies old infrastructure code.
      - name: Check out website from rollback commit
        if: env.COMMIT_SHA != ''
        run: |
          if ! [[ "$COMMIT_SHA" =~ ^[0-9a-fA-F]{7,40}$ ]]; then
            echo "::error::commit_sha must be a 7-40 character hexadecimal commit SHA."
            exit 1
          fi
          if ! SHA="$(git rev-parse --verify --quiet "${COMMIT_SHA}^{commit}")"; then
            echo "::error::Commit $COMMIT_SHA not found in this repository."
            exit 1
          fi
          # Only commits that are part of the selected branch may be deployed to its stage.
          if ! git merge-base --is-ancestor "$SHA" HEAD; then
            echo "::error::Commit $SHA is not in the history of $GITHUB_REF_NAME; it can't be deployed to $ENVIRONMENT."
            exit 1
          fi
          if ! git cat-file -e "$SHA:website/package.json" 2>/dev/null; then
            echo "::error::Commit $SHA has no website/ to deploy."
            exit 1
          fi
          git restore --source="$SHA" --worktree -- website
          SUBJECT="$(git log -1 --format='%h %s' "$SHA")"
          echo "Rolling website back to $SUBJECT"
          echo "### ⏪ $ENVIRONMENT website rolled back to \`$SUBJECT\`" >> "$GITHUB_STEP_SUMMARY"

      # --- Build the website (Terraform uploads website/dist) -----------------------------
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: "11.16.0"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
          cache: pnpm
          cache-dependency-path: website/pnpm-lock.yaml

      - name: Build website
        working-directory: website
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.15.6"
          terraform_wrapper: false # the scripts read terraform's stdout directly

      # --- AWS credentials (OIDC) -------------------------------------------------------------
      # Assumes the deploy role from aws_role/ with short-lived credentials; no AWS keys are stored.
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      # --- Deploy -----------------------------------------------------------------------------
      # Secrets go to the runner's temp dir (outside the checkout) and are removed afterwards.
      # The environment's REMOTE_STORAGE_* secrets become the <PREFIX>_REMOTE_STORAGE_* settings
      # (PROD_, STAGING_, DEV_) that infrastructure/scripts expect, in a KEY=value file.
      - name: Write environment secrets
        run: bash infrastructure/scripts/ci-write-env.sh
        env:
          REMOTE_STORAGE_AWS_S3_BUCKET: ${{ secrets.REMOTE_STORAGE_AWS_S3_BUCKET }}
          REMOTE_STORAGE_AWS_REGION: ${{ secrets.REMOTE_STORAGE_AWS_REGION }}
          REMOTE_STORAGE_AWS_S3_KEY: ${{ secrets.REMOTE_STORAGE_AWS_S3_KEY }}
          TFVARS_JSON: ${{ secrets.TFVARS_JSON }}

      - name: Deploy
        run: bash infrastructure/scripts/deploy.sh

      - name: Show website URL
        if: env.ACTION == 'apply'
        working-directory: infrastructure
        run: echo "### $ENVIRONMENT → $(terraform output -raw website_url)" >> "$GITHUB_STEP_SUMMARY"

      - name: Remove secrets written to disk
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/remote-state.$ENVIRONMENT.env" "$RUNNER_TEMP/$ENVIRONMENT.tfvars.json"
          rm -rf infrastructure/.terraform # holds backend config, possibly with credentials
